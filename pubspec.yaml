name: monsnatch
description: "Momon Snatch card battle game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.2  
  dio: ^5.4.0
  web_socket_channel: ^2.4.0

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Game Engine
  flame: ^1.17.0
  flame_bloc: ^1.9.0

  # Network & Connectivity
  connectivity_plus: ^5.0.2

  # DI
  get_it: ^7.6.4

  # Utils
  dartz: ^0.10.1

  flutter_svg: ^2.0.9

# Haptic feedback on card placement
  vibration: ^2.0.1


  card_stack_swiper: ^1.1.1
  animated_cards_carousel: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.5
  mocktail: ^1.0.3
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/cards/
    - assets/images/ui/
    - assets/fonts/